# DNS Zone Manager - Docker Compose Configuration
# ================================================
# This config is used by docker-compose.yaml
# For local development without Docker, use config.dev.yaml instead

# =============================================================================
# TSIG Keys (referenced by name from dns and notify sections)
# =============================================================================
# Define all TSIG keys here. Other sections reference them by name.
# Generate new keys with: tsig-keygen -a hmac-sha256 <key-name>
tsig_keys:
  - name: dns-api-key
    secret: K8vC2mP9nQ4rT6wX1yB3fG5hJ7kL0mN2pR4sU6vW8xY=
    algorithm: hmac-sha256

# DNS Server - connects to BIND container on Docker network.
# Uses the Compose service name; the API resolves it to the container's
# current IP at startup, so no static network/IP is required.
dns:
  server: bind
  port: 53
  timeout: 10.0
  axfr_timeout: 60.0
  # Reference to TSIG key for DDNS updates
  update_tsig_key: dns-api-key
  # AXFR uses same key if not specified
  # axfr_tsig_key: dns-api-key

# API Key Authentication
api_key:
  enabled: true
  keys:
    - name: admin
      secret: demo-api-key-12345
    - name: readonly
      secret: another-key-67890

# Azure AD disabled for demo
azure_ad:
  enabled: false

# Cache Configuration
cache:
  enabled: true
  min_refresh_interval: 60
  max_refresh_interval: 86400

# Catalog Zone Configuration
catalog:
  enabled: true
  zone_name: catalog.example.
  poll_interval: 60
  notify_bind_address: 0.0.0.0
  notify_udp_port: 5354
  notify_tcp_port: 5354
  auto_load_zones: true
  remove_stale_zones: false

# NOTIFY Listener
notify:
  enabled: true
  bind_address: 0.0.0.0
  udp_port: 5354
  tcp_port: 5354
  prefer_ixfr: true
  require_tsig: false
  # Optional: Reference to TSIG key for NOTIFY validation
  # Falls back to dns.update_tsig_key if not specified
  # tsig_key: notify-key

# Logging - JSON for production/Docker
logging:
  format: json
  level: DEBUG
  sample_rate: 1.0
  slow_threshold_ms: 1000

# Debug mode for demo
debug: true
