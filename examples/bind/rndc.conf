// rndc configuration for BIND server administration
// Usage: rndc -c examples/bind/rndc.conf <command>
//
// Port 953 inside container is mapped to 15953 on localhost

key "rndc-key" {
    algorithm hmac-sha256;
    secret "xT7J2kLpN9qRvW4mY8sF1gH5bC3dE6aZ0iO7uP2wX4c=";
};

options {
    default-key "rndc-key";
    default-server 127.0.0.1;
    default-port 15953;
};

server 127.0.0.1 {
    key "rndc-key";
    port 15953;
};

