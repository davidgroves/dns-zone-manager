# OpenTelemetry Collector config for grafana/otel-lgtm.
# Extends the image defaults with a Prometheus scrape of the DNS Zone Manager
# /metrics endpoint (examples stack: dns-zone-manager; devcontainer: dev).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 15s
          static_configs:
            - targets: ["127.0.0.1:8888"]
  prometheus/dns-zone-manager:
    config:
      scrape_configs:
        - job_name: "dns-zone-manager"
          scrape_interval: 5s
          metrics_path: /metrics
          static_configs:
            # One of these resolves depending on which compose file is running;
            # the other target simply fails to scrape and is ignored.
            - targets:
                - "dns-zone-manager:8000"
                - "dev:8000"
              labels:
                service: dns-zone-manager

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [otlp, prometheus/collector, prometheus/dns-zone-manager]
      processors: [batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
