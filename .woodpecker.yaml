# CI: https://ci.codeberg.org/davidgroves/dns-zone-manager
# Requires Woodpecker secrets:
#   woodpecker_dns_zone_manager — Codeberg access token (package read/write)
#   renovate_token              — Renovate bot PAT (see DEVELOPMENT.md)
#   github_com_token            — read-only github.com PAT (no scopes) for changelogs
#
# On a v* tag push this publishes:
#   - PyPI package   -> https://codeberg.org/api/packages/davidgroves/pypi
#   - Backend image  -> codeberg.org/${CI_REPO_OWNER}/dns-zone-manager/backend
#   - Frontend image -> codeberg.org/${CI_REPO_OWNER}/dns-zone-manager/frontend
#
# Images are built with kaniko (no Docker daemon required), matching the
# dns-txt-timestamper pipeline. Runs on the self-hosted "fibrecat" agent.

labels:
  instance: fibrecat

steps:
  test-backend:
    image: ghcr.io/astral-sh/uv:python3.13-trixie
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - uv run --extra dev pytest -m "not integration"
    when:
      event: [push, pull_request, tag]

  test-frontend:
    image: node:22-slim
    commands:
      - npm ci
      - npm run typecheck
      - npm run test
    when:
      event: [push, pull_request, tag]

  publish-pypi:
    image: ghcr.io/astral-sh/uv:python3.13-trixie
    environment:
      UV_PUBLISH_USERNAME: ${CI_REPO_OWNER}
      UV_PUBLISH_PASSWORD:
        from_secret: woodpecker_dns_zone_manager
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - uv build
      - uv publish --publish-url "https://codeberg.org/api/packages/${CI_REPO_OWNER}/pypi" dist/*
    depends_on: [test-backend]
    when:
      event: tag
      ref: refs/tags/v*

  publish-backend:
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: codeberg.org
      repo: ${CI_REPO_OWNER}/dns-zone-manager/backend
      dockerfile: Dockerfile
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      username: ${CI_REPO_OWNER}
      password:
        from_secret: woodpecker_dns_zone_manager
    depends_on: [test-backend]
    when:
      event: tag
      ref: refs/tags/v*

  publish-frontend:
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: codeberg.org
      repo: ${CI_REPO_OWNER}/dns-zone-manager/frontend
      dockerfile: Dockerfile.frontend
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      build_args:
        - VERSION=${CI_COMMIT_TAG}
      username: ${CI_REPO_OWNER}
      password:
        from_secret: woodpecker_dns_zone_manager
    depends_on: [test-backend]
    when:
      event: tag
      ref: refs/tags/v*

  renovate:
    image: ghcr.io/renovatebot/renovate:full
    environment:
      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: https://codeberg.org/api/v1
      RENOVATE_TOKEN:
        from_secret: renovate_token
      RENOVATE_REPOSITORIES: davidgroves/dns-zone-manager
      # Read-only github.com PAT (no scopes) used only to fetch changelogs /
      # release notes for dependencies and avoid github.com rate limiting.
      GITHUB_COM_TOKEN:
        from_secret: github_com_token
      LOG_LEVEL: info
    commands:
      - renovate
    when:
      - event: cron
        cron: renovate
