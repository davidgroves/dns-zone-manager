                                                                    </template>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- Rollback Preview Section -->
                            <template x-if="rollbackTargetSerial">
                                <div class="rollback-preview" style="margin-top: 1.5rem; padding: 1rem; border: 2px solid var(--warning); border-radius: 0.5rem; background: var(--warning-subtle, rgba(255, 193, 7, 0.1));">
                                    <h4 style="margin: 0 0 1rem 0; display: flex; align-items: center; gap: 0.5rem;">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                            <path d="M1 4v6h6"/>
                                            <path d="M23 20v-6h-6"/>
                                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                                        </svg>
                                        Rollback Preview
                                    </h4>

                                    <template x-if="rollbackLoading">
                                        <div class="loading"><div class="spinner"></div></div>
                                    </template>

                                    <template x-if="!rollbackLoading && rollbackPreview">
                                        <div>
                                            <template x-if="!rollbackPreview.can_rollback">
                                                <div class="alert alert-warning">
                                                    <strong>Cannot Rollback:</strong> <span x-text="rollbackPreview.warning"></span>
                                                </div>
                                            </template>

                                            <template x-if="rollbackPreview.can_rollback">
                                                <div>
                                                    <p>
                                                        Rolling back from serial <strong x-text="rollbackPreview.current_serial"></strong> 
                                                        to serial <strong x-text="rollbackPreview.target_serial"></strong> 
                                                        will apply <strong x-text="rollbackPreview.change_count"></strong> change(s):
                                                    </p>

                                                    <template x-if="rollbackPreview.warning">
                                                        <div class="alert alert-info" style="margin: 0.5rem 0;">
                                                            <span x-text="rollbackPreview.warning"></span>
                                                        </div>
                                                    </template>

                                                    <template x-if="rollbackPreview.changes.length > 0">
                                                        <div style="max-height: 200px; overflow-y: auto; margin: 0.5rem 0;">
                                                            <table class="history-changes-table" style="width: 100%;">
                                                                <thead>
                                                                    <tr>
                                                                        <th style="width: 60px;">Action</th>
                                                                        <th>Name</th>
                                                                        <th style="width: 80px;">Type</th>
                                                                        <th>Data</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    <template x-for="change in rollbackPreview.changes.slice(0, 50)" :key="change.name + change.type + change.action">
                                                                        <tr :class="change.action === 'add' ? 'history-add' : 'history-delete'">
                                                                            <td>
                                                                                <span class="badge" :class="change.action === 'add' ? 'badge-success' : 'badge-danger'" x-text="change.action === 'add' ? '+ADD' : '−DEL'"></span>
                                                                            </td>
                                                                            <td x-text="change.name.replace(/\.$/, '')"></td>
                                                                            <td><span class="badge" x-text="change.type"></span></td>
                                                                            <td style="font-family: monospace; font-size: 0.85rem;" x-text="change.records.join(', ')"></td>
                                                                        </tr>
                                                                    </template>
                                                                </tbody>
                                                            </table>
                                                            <template x-if="rollbackPreview.changes.length > 50">
                                                                <p class="text-muted" style="text-align: center; margin-top: 0.5rem;">
                                                                    ...and <span x-text="rollbackPreview.changes.length - 50"></span> more changes
                                                                </p>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                                                        <button @click="clearRollbackSelection()" class="btn btn-ghost">Cancel</button>
                                                        <button @click="executeRollback()" 
                                                                class="btn btn-warning"
                                                                :disabled="rollbackLoading || rollbackPreview.change_count === 0">
                                                            <span x-show="rollbackLoading" class="spinner" style="width: 14px; height: 14px;"></span>
                                                            Execute Rollback
                                                        </button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
                <div class="modal-footer">
                    <button @click="closeHistoryModal()" class="btn btn-ghost">Close</button>
                    <button @click="loadZoneHistory()" 
                            class="btn btn-primary" 
                            :disabled="historyLoading">
                        <span x-show="historyLoading" class="spinner" style="width: 14px; height: 14px;"></span>
                        Refresh History
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Toast Container -->
    <div class="toast-container">
        <template x-for="toast in toasts" :key="toast.id">
            <div class="toast" :class="toast.type" x-show="toast.visible" x-transition>
                <span class="toast-message" x-text="toast.message"></span>
                <button @click="removeToast(toast.id)" class="btn btn-ghost btn-icon btn-sm">×</button>
            </div>
        </template>
    </div>

    <script>
        // Initialize the DNS app - config is fetched from API
        function app() {
            return window.createDnsApp({});
        }
    </script>
    <style>
        .spinning {
            animation: spin 1s linear infinite;
        }
        
        /* Sortable table headers */
        th.sortable {
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        
        th.sortable:hover {
            background: var(--bg-hover);
        }
        
        .sort-icon {
            margin-left: 0.35rem;
            font-size: 0.7rem;
            opacity: 0.5;
        }
        
        th.sortable:hover .sort-icon {
            opacity: 1;
        }
        
        /* Checkbox label in search box */
        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        .checkbox-label:hover {
            color: var(--text-primary);
        }
        
        .checkbox-label input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
            accent-color: var(--accent);
        }
        
        /* IDN styling */
        .idn-label {
            border-bottom: 1px dotted var(--text-muted);
        }
        
        /* UTF-8 escaped content styling */
        .utf8-label {
            border-bottom: 1px dotted var(--text-muted);
        }
        
        .badge-info {
            background: var(--accent);
            color: var(--bg-primary);
        }
        
        .badge-clickable {
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        
        .badge-clickable:hover {
            transform: scale(1.2);
        }
        
        .badge-clickable:active {
            transform: scale(0.95);
        }
        
        .badge-xs {
            font-size: 0.6rem;
            padding: 0.1rem 0.25rem;
            margin-left: 0.25rem;
            vertical-align: middle;
        }
        
        /* Zone History Styles */
        .history-changes-table {
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        
        .history-changes-table th,
        .history-changes-table td {
            padding: 0.5rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        
        .history-changes-table th {
            background: var(--bg-tertiary, var(--bg-secondary));
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        
        .history-add {
            background: rgba(46, 204, 113, 0.1);
        }
        
        .history-delete {
            background: rgba(231, 76, 60, 0.1);
        }
        
        .badge-success {
            background: var(--success, #2ecc71);
            color: white;
        }
        
        .badge-danger {
            background: var(--danger, #e74c3c);
            color: white;
        }
        
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .alert-warning {
            background: rgba(255, 193, 7, 0.15);
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: var(--text-primary);
        }
        
        .alert-info {
            background: rgba(52, 152, 219, 0.15);
            border: 1px solid rgba(52, 152, 219, 0.3);
            color: var(--text-primary);
        }
        
        .btn-warning {
            background: var(--warning, #f39c12);
            color: white;
            border: none;
        }
        
        .btn-warning:hover {
            background: #e08e0b;
        }
        
        .btn-warning.btn-ghost {
            background: transparent;
            color: var(--warning, #f39c12);
            border: 1px solid var(--warning, #f39c12);
        }
        
        .btn-warning.btn-ghost:hover {
            background: var(--warning, #f39c12);
            color: white;
        }
        
        /* x-collapse transition helper */
        [x-collapse] {
            overflow: hidden;
        }
    </style>
</body>
</html>
