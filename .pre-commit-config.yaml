repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff format

  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run ty check backend
        language: system
        types: [python]
        pass_filenames: false

      - id: tsc
        name: typescript type check
        entry: npm run typecheck
        language: system
        types: [ts]
        pass_filenames: false

