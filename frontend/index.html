<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Zone Editor</title>
    <script type="module" src="/main.ts"></script>
</head>
<body x-data="app()" x-init="init()">
    <!-- Login Screen -->
    <template x-if="!authenticated">
        <div class="login-container">
            <div class="login-card">
                <h1>🌐 DNS Zone Editor</h1>
                <p>Sign in to manage DNS records</p>
                
                <template x-if="azureEnabled">
                    <div>
                        <button @click="loginAzure()" class="btn btn-primary" style="width: 100%">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.483 21.3H24L14.025 4.013l-3.038 8.347 5.836 6.938L5.483 21.3zM13.049 2.7l-6.394 11.33 7.037-1.67L13.049 2.7zM0 15.398l5.483 5.902 5.764-5.348L0 15.398z"/></svg>
                            Sign in with Azure AD
                        </button>
                        <div class="login-divider">or use API Key</div>
                    </div>
                </template>
                
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" x-model="apiKeyInput" placeholder="Enter your API key" @keyup.enter="loginApiKey()">
                </div>
                <button @click="loginApiKey()" class="btn btn-success mt-2" style="width: 100%">
                    Sign in with API Key
                </button>
                
                <p x-show="loginError" class="text-danger mt-2" x-text="loginError"></p>
            </div>
        </div>
    </template>

    <!-- Main Application -->
    <template x-if="authenticated">
        <div class="app-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h1 :title="appVersion ? 'Version: ' + appVersion : ''">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                        </svg>
                        DNS Zones
                    </h1>
                </div>
                
                <!-- Catalog Status -->
                <template x-if="catalogStatus && catalogStatus.enabled">
                    <div style="padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border-color); font-size: 0.75rem;">
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <span :class="catalogStatus.connected ? 'text-success' : 'text-warning'">●</span>
                            <span class="text-muted">Catalog: <span x-text="catalogStatus.zones_discovered"></span> zones</span>
                            <button @click="syncCatalog()" class="btn btn-ghost btn-sm btn-icon" style="margin-left: auto; padding: 0.25rem;" title="Sync Catalog" :disabled="syncingCatalog">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" :class="{ 'spinning': syncingCatalog }">
                                    <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </template>

                <div class="zone-filter">
                    <input type="text" 
                           x-model="zoneFilter" 
                           placeholder="Filter zones..."
                           class="zone-filter-input">
                    <template x-if="zoneFilter">
                        <button @click="zoneFilter = ''" class="zone-filter-clear" title="Clear filter">×</button>
                    </template>
                </div>
                
                <!-- Zone Pagination Controls -->
                <template x-if="zoneTotalCount > 0">
                    <div class="zone-pagination">
                        <div class="zone-pagination-info">
                            <span x-text="'Zones ' + zoneStartIndex + '-' + zoneEndIndex + ' / ' + zoneTotalCount"></span>
                            <span class="zone-count-info">
                                Page <input type="number" 
                                    class="page-input page-input-sm" 
                                    :value="zoneCurrentPage" 
                                    @change="goToZonePage(parseInt($event.target.value))"
                                    @keyup.enter="goToZonePage(parseInt($event.target.value))"
                                    min="1" 
                                    :max="zoneTotalPages"> of <span x-text="zoneTotalPages"></span>
                            </span>
                        </div>
                        <div class="zone-pagination-controls">
                            <button 
                                @click="loadZonesFirstPage()" 
                                :disabled="zoneCursorHistory.length === 0"
                                class="btn btn-ghost btn-xs"
                                title="First page">
                                ⟨⟨
                            </button>
                            <button 
                                @click="loadZonesPrevPage()" 
                                :disabled="zoneCursorHistory.length === 0"
                                class="btn btn-ghost btn-xs"
                                title="Previous page">
                                ⟨
                            </button>
                            <button 
                                @click="loadZonesNextPage()" 
                                :disabled="!zoneHasMore"
                                class="btn btn-ghost btn-xs"
                                title="Next page">
                                ⟩
                            </button>
                            <button 
                                @click="loadZonesLastPage()" 
                                :disabled="!zoneHasMore"
                                class="btn btn-ghost btn-xs"
                                title="Last page">
                                ⟩⟩
                            </button>
                            <select x-model="zonePageSizeMode" 
                                    @change="changeZonePageSizeMode($event.target.value)"
                                    class="pagination-select pagination-select-xs">
                                <option value="auto">Auto</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                                <option value="250">250</option>
                            </select>
                        </div>
                    </div>
                </template>
                
                <div class="zone-list">
                    <template x-if="loadingZones">
                        <div class="loading"><div class="spinner"></div></div>
                    </template>
                    
                    <template x-if="!loadingZones && zones.length === 0">
                        <div class="empty-state">
                            <p class="text-muted">No zones loaded</p>
                            <button @click="showAddZone = true" class="btn btn-ghost btn-sm mt-1">
                                Add Non-Catalog Zone
                            </button>
                        </div>
                    </template>
                    
                    <template x-if="!loadingZones && zones.length > 0 && filteredZones.length === 0">
                        <div class="empty-state">
                            <p class="text-muted">No matching zones</p>
                        </div>
                    </template>
                    
                    <template x-for="zone in filteredZones" :key="zone.zone">
                        <div class="zone-item" 
                             :class="{ active: selectedZone === zone.zone }"
                             @click="selectZone(zone.zone)">
                            <div class="zone-name">
                                <span :class="{ 'idn-label': zone.zone_is_idn }"
                                      x-text="zone.zone.replace(/\.$/, '')"></span>
                                <template x-if="zone.zone_is_idn">
                                    <span class="badge badge-info badge-clickable" style="font-size: 0.6rem; margin-left: 0.25rem;" 
                                          :title="zone.zone_utf8 + '\nClick to copy to clipboard'"
                                          @click.stop="navigator.clipboard.writeText(zone.zone_utf8); toast('Copied: ' + zone.zone_utf8, 'success')">🌐</span>
                                </template>
                                <template x-if="catalogZones.has(zone.zone.toLowerCase())">
                                    <span class="badge badge-success" style="font-size: 0.6rem; margin-left: 0.25rem;" title="From catalog">CAT</span>
                                </template>
                            </div>
                            <div class="zone-meta">
                                <span x-text="zone.rrset_count + ' records'"></span>
                                · Serial <span x-text="zone.serial"></span>
                            </div>
                        </div>
                    </template>
                </div>
                
                <div style="padding: 0.75rem; border-top: 1px solid var(--border-color);">
                    <button @click="showAddZone = true" class="btn btn-ghost btn-sm" style="width: 100%">
                        + Add Non-Catalog Zone
                    </button>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Header -->
                <header class="header">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                        </svg>
                        <input type="text" 
                               x-model="searchQuery" 
                               @input.debounce.300ms="performSearch()"
                               placeholder="">
                        <select x-model="searchField" @change="performSearch()" class="search-field-select">
                            <option value="name">Name</option>
                            <option value="data">Data</option>
                            <option value="either">Either</option>
                        </select>
                        <label class="checkbox-label" style="margin-left: 0.5rem; white-space: nowrap;">
                            <input type="checkbox" x-model="searchAllZones" @change="performSearch()">
                            <span>All Zones</span>
                        </label>
                    </div>
                    
                    <div class="header-actions">
                        <select x-model="searchType" @change="performSearch()" style="width: auto;">
                            <option value="">All Types</option>
                            <option value="A">A</option>
                            <option value="AAAA">AAAA</option>
                            <option value="CAA">CAA</option>
                            <option value="CNAME">CNAME</option>
                            <option value="MX">MX</option>
                            <option value="NS">NS</option>
                            <option value="PTR">PTR</option>
                            <option value="SOA">SOA</option>
                            <option value="SRV">SRV</option>
                            <option value="TXT">TXT</option>
                        </select>
                        
                        <button @click="refreshCurrentZone()" class="btn btn-ghost btn-icon" title="Refresh">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" :class="{ 'spinning': refreshing }">
                                <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/>
                            </svg>
                        </button>
                        
                        <button @click="showNsupdate = true" class="btn btn-ghost" title="NSUPDATE">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
                            </svg>
                            NSUPDATE
                        </button>
                        
                        <button @click="atomicMode = !atomicMode; onAtomicModeChange()" 
                                class="btn btn-ghost atomic-toggle" 
                                :class="{ 'active': atomicMode }" 
                                title="Queue changes instead of applying immediately">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <!-- Nucleus -->
                                <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
                                <!-- Electron orbits -->
                                <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(0 12 12)"/>
                                <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(60 12 12)"/>
                                <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(-60 12 12)"/>
                            </svg>
                            <span>Atomic</span>
                        </button>
                        
                        <span x-show="currentUser" class="text-muted" x-text="currentUser" :title="'Signed in as ' + currentUser"></span>

                        <button @click="logout()" class="btn btn-ghost btn-logout" title="Logout">
                            Logout
                        </button>
                    </div>
                </header>

                <!-- Content -->
                <div class="content">
                    <!-- No Zone Selected -->
                    <template x-if="!selectedZone && !isSearching">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            </svg>
                            <h3>Select a Zone</h3>
                            <p>Choose a zone from the sidebar to view and manage records</p>
                        </div>
                    </template>

                    <!-- Search Results -->
                    <template x-if="isSearching">
                        <div class="card">
                            <div class="card-header">
                                <h2 x-text="searchAllZones ? 'Search Results (All Zones)' : 'Filtered Results'"></h2>
                                <button @click="clearSearch()" class="btn btn-ghost btn-sm">Clear</button>
                            </div>
                            
                            <!-- Search Pagination Controls (at top) -->
                            <div class="pagination-controls" x-show="searchTotalCount > 0">
                                <div class="pagination-info">
                                    <span x-text="'Results ' + searchStartIndex + '-' + searchEndIndex + ' / ' + searchTotalCount"></span>
                                    <span class="page-indicator">
                                        Page <input type="number" 
                                            class="page-input" 
                                            :value="searchCurrentPage" 
                                            @change="goToSearchPage(parseInt($event.target.value))"
                                            @keyup.enter="goToSearchPage(parseInt($event.target.value))"
                                            min="1" 
                                            :max="searchTotalPages"> of <span x-text="searchTotalPages"></span>
                                    </span>
                                </div>
                                <div class="pagination-actions">
                                    <button @click="searchGoToFirstPage()" 
                                            class="btn btn-ghost btn-sm" 
                                            :disabled="searchCursorHistory.length === 0"
                                            title="Go to first page">
                                        ⟨⟨ First
                                    </button>
                                    <button @click="searchGoToPrevPage()" 
                                            class="btn btn-ghost btn-sm" 
                                            :disabled="searchCursorHistory.length === 0"
                                            title="Go to previous page">
                                        ⟨ Prev
                                    </button>
                                    <button @click="searchGoToNextPage()" 
                                            class="btn btn-ghost btn-sm" 
                                            :disabled="!searchHasMore"
                                            title="Go to next page">
                                        Next ⟩
                                    </button>
                                    <button @click="searchGoToLastPage()" 
                                            class="btn btn-ghost btn-sm" 
                                            :disabled="!searchHasMore"
                                            title="Go to last page">
                                        Last ⟩⟩
                                    </button>
                                    <select x-model="searchPageSizeMode" 
                                            @change="changeSearchPageSizeMode($event.target.value)"
                                            class="pagination-select">
                                        <option value="auto">Auto</option>
                                        <option value="25">25</option>
                                        <option value="50">50</option>
                                        <option value="100">100</option>
                                        <option value="250">250</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="table-container">
                                <template x-if="searchResults.length === 0 && !selectedZone && !searchAllZones">
                                    <div class="empty-state">
                                        <p>Select a zone first, or enable "All Zones" to search globally</p>
                                    </div>
                                </template>
                                <template x-if="searchResults.length === 0 && (selectedZone || searchAllZones)">
                                    <div class="empty-state">
                                        <p>No records match your search</p>
                                    </div>
                                </template>
                                <template x-if="searchResults.length > 0">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th x-show="searchAllZones" class="sortable" @click="sortSearchBy('zone')">
                                                    Zone <span class="sort-icon" x-text="getSearchSortIcon('zone')"></span>
                                                </th>
                                                <th class="sortable" @click="sortSearchBy('name')">
                                                    FQDN <span class="sort-icon" x-text="getSearchSortIcon('name')"></span>
                                                </th>
                                                <th class="sortable col-type" @click="sortSearchBy('type')">
                                                    Type <span class="sort-icon" x-text="getSearchSortIcon('type')"></span>
                                                </th>
                                                <th x-show="searchHasNonINClass" class="sortable col-class" @click="sortSearchBy('rdclass')">
                                                    Class <span class="sort-icon" x-text="getSearchSortIcon('rdclass')"></span>
                                                </th>
                                                <th class="sortable col-ttl" @click="sortSearchBy('ttl')">
                                                    TTL <span class="sort-icon" x-text="getSearchSortIcon('ttl')"></span>
                                                </th>
                                                <th class="sortable" @click="sortSearchBy('data')">
                                                    Data <span class="sort-icon" x-text="getSearchSortIcon('data')"></span>
                                                </th>
                                                <th class="col-actions"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="item in sortedSearchResults" :key="item.zone + item.name + item.type + item.rdclass">
                                                <tr>
                                                    <td x-show="searchAllZones">
                                                        <span class="text-muted" 
                                                              :title="item.zone_is_idn ? item.zone_utf8 : null"
                                                              :class="{ 'idn-label': item.zone_is_idn }"
                                                              x-text="item.zone.replace(/\.$/, '')"></span>
                                                        <template x-if="item.zone_is_idn">
                                                            <span class="badge badge-info badge-xs badge-clickable" 
                                                                  title="Click to copy UTF-8"
                                                                  @click.stop="navigator.clipboard.writeText(item.zone_utf8); toast('Copied: ' + item.zone_utf8, 'success')">🌐</span>
                                                        </template>
                                                    </td>
                                                    <td>
                                                        <span class="record-name" 
                                                              :class="{ 'idn-label': item.name_is_idn }"
                                                              x-text="item.name.replace(/\.$/, '')"></span>
                                                        <template x-if="item.name_is_idn">
                                                            <span class="badge badge-info badge-xs badge-clickable" 
                                                                  :title="item.name_utf8 + '\nClick to copy to clipboard'"
                                                                  @click.stop="navigator.clipboard.writeText(item.name_utf8); toast('Copied: ' + item.name_utf8, 'success')">🌐</span>
                                                        </template>
                                                    </td>
                                                    <td><span class="record-type" :class="item.type" x-text="item.type"></span></td>
                                                    <td x-show="searchHasNonINClass"><span class="record-class" x-text="item.rdclass || 'IN'"></span></td>
                                                    <td><span class="record-ttl" x-text="item.ttl"></span></td>
                                                    <td>
                                                        <span class="record-data" 
                                                              :class="{ 'utf8-label': item.records_is_utf8 }"
                                                              x-text="item.records.join(', ')"></span>
                                                        <template x-if="item.records_is_utf8">
                                                            <span class="badge badge-info badge-xs badge-clickable" 
                                                                  :title="item.records_utf8.join('\n') + '\nClick to copy to clipboard'"
                                                                  @click.stop="navigator.clipboard.writeText(item.records_utf8.join(', ')); toast('Copied UTF-8 data', 'success')">🌐</span>
                                                        </template>
                                                    </td>
                                                    <td class="col-actions">
                                                        <div class="record-actions">
                                                            <template x-if="item.type === 'A' || item.type === 'AAAA'">
                                                                <button @click="openReversePtrModal(item)" class="btn btn-ghost btn-sm btn-icon btn-action-reverse" title="Add Reverse PTR">
                                                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                                        <path d="M9 14l-4 4 4 4"/>
                                                                        <path d="M5 18h14"/>
                                                                        <path d="M15 10l4-4-4-4"/>
                                                                        <path d="M19 6H5"/>
                                                                    </svg>
                                                                </button>
                                                            </template>
                                                            <template x-if="item.type !== 'A' && item.type !== 'AAAA'">
                                                                <span class="btn btn-ghost btn-sm btn-icon" style="visibility: hidden;"></span>
                                                            </template>
                                                            <button @click="editSearchResult(item.zone, item)" class="btn btn-ghost btn-sm btn-icon btn-action-edit" title="Edit">
                                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                                                </svg>
                                                            </button>
                                                            <button @click="confirmDeleteSearchResult(item.zone, item)" class="btn btn-ghost btn-sm btn-icon btn-action-delete" title="Delete">
                                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                                    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                                                </svg>
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Zone Records -->
                    <template x-if="selectedZone && !isSearching">
                        <div class="card">
                            <div class="card-header">
                                <h2>
                                    <span x-text="selectedZone.replace(/\.$/, '')"></span>
                                    <button @click="refreshZone($event)" 
                                            class="btn btn-ghost btn-sm btn-icon" 
                                            style="margin-left: 0.5rem;"
                                            title="Click: Reload from cache&#10;Shift+Click: Refresh from DNS server"
                                            :disabled="refreshingZone">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" 
                                             :class="{ 'spinning': refreshingZone }">
                                            <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/>
                                        </svg>
                                    </button>
                                    <button @click="customTypeMode = false; showAddRecord = true" class="btn btn-success btn-sm" style="margin-left: 0.5rem;">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M12 5v14M5 12h14"/>
                                        </svg>
                                        Add Record
                                    </button>
                                </h2>
                                <div style="display: flex; gap: 0.5rem;">
                                    <button @click="openHistoryModal()" class="btn btn-ghost btn-sm" title="View zone history">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="12" cy="12" r="10"/>
                                            <polyline points="12 6 12 12 16 14"/>
                                        </svg>
                                        History
                                    </button>
                                    <button @click="exportZone()" class="btn btn-ghost btn-sm" title="Export zone file">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                            <polyline points="7 10 12 15 17 10"/>
                                            <line x1="12" y1="15" x2="12" y2="3"/>
                                        </svg>
                                        Export
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Record Pagination Controls (at top) -->
                            <div class="pagination-controls" x-show="totalRecords > 0">
                                <div class="pagination-info">
                                    <span x-text="'Records ' + recordStartIndex + '-' + recordEndIndex + ' / ' + totalRecords"></span>
                                    <span class="page-indicator">
                                        Page <input type="number" 
                                            class="page-input" 
                                            :value="recordCurrentPage" 
                                            @change="goToRecordPage(parseInt($event.target.value))"
                                            @keyup.enter="goToRecordPage(parseInt($event.target.value))"
                                            min="1" 
                                            :max="recordTotalPages"> of <span x-text="recordTotalPages"></span>
                                    </span>
                                </div>
                                <div class="pagination-actions">
                                    <button @click="goToFirstPage()" 
                                            class="btn btn-ghost btn-sm" 
                                            :disabled="recordCursorHistory.length === 0"
                                            title="Go to first page">
                                        ⟨⟨ First
                                    </button>
                                    <button @click="goToPrevPage()" 
                                            class="btn btn-ghost btn-sm" 
                                            :disabled="recordCursorHistory.length === 0"
                                            title="Go to previous page">
                                        ⟨ Prev
                                    </button>
                                    <button @click="goToNextPage()" 
                                            class="btn btn-ghost btn-sm" 
                                            :disabled="!hasMoreRecords"
                                            title="Go to next page">
                                        Next ⟩
                                    </button>
                                    <button @click="goToLastPage()" 
                                            class="btn btn-ghost btn-sm" 
                                            :disabled="!hasMoreRecords"
                                            title="Go to last page">
                                        Last ⟩⟩
                                    </button>
                                    <select x-model="pageSizeMode" 
                                            @change="changeRecordPageSizeMode($event.target.value)"
                                            class="pagination-select">
                                        <option value="auto">Auto</option>
                                        <option value="25">25</option>
                                        <option value="50">50</option>
                                        <option value="100">100</option>
                                        <option value="250">250</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="table-container">
                                <template x-if="loadingRecords">
                                    <div class="loading"><div class="spinner"></div></div>
                                </template>
                                
                                <template x-if="!loadingRecords">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th class="sortable" @click="sortBy('name')">
                                                    FQDN <span class="sort-icon" x-text="getSortIcon('name')"></span>
                                                </th>
                                                <th class="sortable col-type" @click="sortBy('type')">
                                                    Type <span class="sort-icon" x-text="getSortIcon('type')"></span>
                                                </th>
                                                <th x-show="hasNonINClass" class="sortable col-class" @click="sortBy('rdclass')">
                                                    Class <span class="sort-icon" x-text="getSortIcon('rdclass')"></span>
                                                </th>
                                                <th class="sortable col-ttl" @click="sortBy('ttl')">
                                                    TTL <span class="sort-icon" x-text="getSortIcon('ttl')"></span>
                                                </th>
                                                <th class="sortable" @click="sortBy('data')">
                                                    Data <span class="sort-icon" x-text="getSortIcon('data')"></span>
                                                </th>
                                                <th class="col-actions"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template x-for="record in filteredRecords" :key="record.name + record.type + (record.rdclass || 'IN')">
                                                <tr>
                                                    <td>
                                                        <span class="record-name" 
                                                              :class="{ 'idn-label': record.name_is_idn }"
                                                              x-text="record.name.replace(/\.$/, '')"></span>
                                                        <template x-if="record.name_is_idn">
                                                            <span class="badge badge-info badge-xs badge-clickable" 
                                                                  :title="record.name_utf8 + '\nClick to copy to clipboard'"
                                                                  @click.stop="navigator.clipboard.writeText(record.name_utf8); toast('Copied: ' + record.name_utf8, 'success')">🌐</span>
                                                        </template>
                                                    </td>
                                                    <td><span class="record-type" :class="record.type" x-text="record.type"></span></td>
                                                    <td x-show="hasNonINClass"><span class="record-class" x-text="record.rdclass || 'IN'"></span></td>
                                                    <td><span class="record-ttl" x-text="record.ttl"></span></td>
                                                    <td>
                                                        <span class="record-data" 
                                                              :class="{ 'utf8-label': record.records_is_utf8 }"
                                                              x-text="record.records.join(', ')"></span>
                                                        <template x-if="record.records_is_utf8">
                                                            <span class="badge badge-info badge-xs badge-clickable" 
                                                                  :title="record.records_utf8.join('\n') + '\nClick to copy to clipboard'"
                                                                  @click.stop="navigator.clipboard.writeText(record.records_utf8.join(', ')); toast('Copied UTF-8 data', 'success')">🌐</span>
                                                        </template>
                                                    </td>
                                                    <td class="col-actions">
                                                        <div class="record-actions">
                                                            <template x-if="record.type === 'A' || record.type === 'AAAA'">
                                                                <button @click="openReversePtrModal(record)" class="btn btn-ghost btn-sm btn-icon btn-action-reverse" title="Add Reverse PTR">
                                                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                                        <path d="M9 14l-4 4 4 4"/>
                                                                        <path d="M5 18h14"/>
                                                                        <path d="M15 10l4-4-4-4"/>
                                                                        <path d="M19 6H5"/>
                                                                    </svg>
                                                                </button>
                                                            </template>
                                                            <template x-if="record.type !== 'A' && record.type !== 'AAAA'">
                                                                <span class="btn btn-ghost btn-sm btn-icon" style="visibility: hidden;"></span>
                                                            </template>
                                                            <button @click="editRecord(record)" class="btn btn-ghost btn-sm btn-icon btn-action-edit" title="Edit">
                                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                                                </svg>
                                                            </button>
                                                            <button @click="confirmDelete(record)" class="btn btn-ghost btn-sm btn-icon btn-action-delete" title="Delete">
                                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                                    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                                                </svg>
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </main>
        </div>
    </template>

    <!-- Add Non-Catalog Zone Modal -->
    <template x-if="showAddZone">
        <div class="modal-backdrop" @click.self="showAddZone = false">
            <div class="modal">
                <div class="modal-header">
                    <h3>Add Non-Catalog Zone</h3>
                    <button @click="showAddZone = false" class="btn btn-ghost btn-icon btn-sm">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Zone Name</label>
                        <input type="text" x-model="newZoneName" placeholder="example.com">
                        <p class="form-hint">Enter the zone name to load from the DNS server</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button @click="showAddZone = false" class="btn btn-ghost">Cancel</button>
                    <button @click="addZone()" class="btn btn-success" :disabled="!newZoneName">Add</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Add/Edit Record Modal -->
    <template x-if="showAddRecord || showEditRecord">
        <div class="modal-backdrop" @click.self="closeRecordModal()">
            <div class="modal">
                <div class="modal-header">
                    <h3>
                        <span x-text="showEditRecord ? 'Edit Record' : 'Add Record'"></span>
                        <span class="modal-zone-label" x-text="'in ' + (showEditRecord ? recordForm.zone : selectedZone)"></span>
                    </h3>
                    <button @click="closeRecordModal()" class="btn btn-ghost btn-icon btn-sm">×</button>
                </div>
                <div class="modal-body">
                    <!-- Name on its own row -->
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" x-model="recordForm.name" :disabled="showEditRecord" placeholder="www">
                        <p class="form-hint">Relative to zone or FQDN</p>
                    </div>
                    <!-- Class and Type on the same row -->
                    <div class="form-row">
                        <div class="form-group form-group-sm">
                            <label>Class</label>
                            <div class="class-input-group">
                                <!-- Dropdown for common classes -->
                                <select x-show="!customClassMode"
                                        x-model="recordForm.rdclass"
                                        :disabled="showEditRecord"
                                        @change="if(recordForm.rdclass === '__custom__') { customClassMode = true; recordForm.rdclass = ''; $nextTick(() => $refs.customClassInput.focus()); }"
                                        class="class-select">
                                    <option value="IN">IN - Internet</option>
                                    <option value="CH">CH - Chaos</option>
                                    <option value="HS">HS - Hesiod</option>
                                    <option disabled>───────────</option>
                                    <option value="__custom__">Custom class...</option>
                                </select>
                                
                                <!-- Text input for custom classes -->
                                <div x-show="customClassMode" class="custom-class-input">
                                    <input type="text"
                                           x-ref="customClassInput"
                                           x-model="recordForm.rdclass"
                                           :disabled="showEditRecord"
                                           placeholder="Class name or number (e.g., 3, 0x3)"
                                           style="width: 100%;">
                                    <button type="button" 
                                            @click="customClassMode = false; recordForm.rdclass = 'IN'"
                                            class="btn btn-ghost btn-sm"
                                            title="Back to common classes">
                                        ←
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <div class="type-input-group">
                                <!-- Dropdown for common types -->
                                <select x-show="!customTypeMode"
                                        x-model="recordForm.type"
                                        :disabled="showEditRecord"
                                        @change="if(recordForm.type === '__custom__') { customTypeMode = true; recordForm.type = ''; $nextTick(() => $refs.customTypeInput.focus()); }"
                                        class="type-select">
                                    <option value="A">A - Address</option>
                                    <option value="AAAA">AAAA - IPv6 Address</option>
                                    <option value="CAA">CAA - Certification Authority</option>
                                    <option value="CNAME">CNAME - Canonical Name</option>
                                    <option value="DNSKEY">DNSKEY - DNS Key</option>
                                    <option value="DS">DS - Delegation Signer</option>
                                    <option value="HTTPS">HTTPS - HTTPS Binding</option>
                                    <option value="LOC">LOC - Location</option>
                                    <option value="MX">MX - Mail Exchange</option>
                                    <option value="NAPTR">NAPTR - Naming Authority Pointer</option>
                                    <option value="NS">NS - Name Server</option>
                                    <option value="PTR">PTR - Pointer</option>
                                    <option value="SOA">SOA - Start of Authority</option>
                                    <option value="SPF">SPF - Sender Policy Framework</option>
                                    <option value="SRV">SRV - Service</option>
                                    <option value="SSHFP">SSHFP - SSH Fingerprint</option>
                                    <option value="SVCB">SVCB - Service Binding</option>
                                    <option value="TLSA">TLSA - TLS Authentication</option>
                                    <option value="TXT">TXT - Text</option>
                                    <option disabled>───────────</option>
                                    <option value="__custom__">Custom type...</option>
                                </select>
                                
                                <!-- Text input for custom types -->
                                <div x-show="customTypeMode" class="custom-type-input">
                                    <input type="text"
                                           x-ref="customTypeInput"
                                           x-model="recordForm.type"
                                           :disabled="showEditRecord"
                                           placeholder="Type name or number (e.g., DNAME, 257, 0x101)"
                                           @input="normalizeRecordType()">
                                    <button type="button" 
                                            @click="customTypeMode = false; recordForm.type = 'A'"
                                            class="btn btn-ghost btn-sm"
                                            title="Back to common types">
                                        ←
                                    </button>
                                </div>
                            </div>
                            <p class="form-hint" x-show="!customTypeMode">Select from common types or choose "Custom type..."</p>
                            <p class="form-hint" x-show="customTypeMode">Enter type name (DNAME) or number (257, 0x101)</p>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>TTL (seconds)</label>
                        <input type="number" x-model.number="recordForm.ttl" min="0">
                    </div>
                    <div class="form-group">
                        <label>Records (one per line)</label>
                        <textarea x-model="recordForm.records" rows="4"></textarea>
                        <p class="form-hint">Enter each record value on a new line</p>
                        
                        <!-- Type-specific examples -->
                        <template x-if="!customTypeMode && getRecordExamples(recordForm.type).length > 0">
                            <div class="record-examples">
                                <div class="examples-label">Examples:</div>
                                <template x-for="example in getRecordExamples(recordForm.type)" :key="example">
                                    <div class="example-row">
                                        <code class="example-value" 
                                              @click="navigator.clipboard.writeText(example); toast('Copied!', 'success')"
                                              title="Click to copy"
                                              x-text="example"></code>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="modal-footer">
                    <button @click="closeRecordModal()" class="btn btn-ghost">Cancel</button>
                    <button @click="saveRecord()" class="btn btn-success" :disabled="saving">
                        <span x-show="saving" class="spinner" style="width: 14px; height: 14px;"></span>
                        <span x-text="showEditRecord ? 'Update' : 'Create'"></span>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Delete Confirmation Modal -->
    <template x-if="showDeleteConfirm">
        <div class="modal-backdrop" @click.self="showDeleteConfirm = false">
            <div class="modal">
                <div class="modal-header">
                    <h3>Delete Record</h3>
                    <button @click="showDeleteConfirm = false" class="btn btn-ghost btn-icon btn-sm">×</button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this record?</p>
                    <div class="card mt-2" style="background: var(--bg-tertiary);">
                        <div class="card-body">
                            <p><strong x-text="deleteTarget?.name"></strong></p>
                            <p class="text-muted"><span x-text="deleteTarget?.type"></span> → <span x-text="deleteTarget?.records?.join(', ')"></span></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button @click="showDeleteConfirm = false" class="btn btn-ghost">Cancel</button>
                    <button @click="deleteRecord()" class="btn btn-danger" :disabled="saving">
                        <span x-show="saving" class="spinner" style="width: 14px; height: 14px;"></span>
                        Delete
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- NSUPDATE Modal -->
    <template x-if="showNsupdate">
        <div class="modal-backdrop" @click.self="showNsupdate = false">
            <div class="modal" style="max-width: 700px;">
                <div class="modal-header">
                    <h3>NSUPDATE Batch</h3>
                    <button @click="showNsupdate = false" class="btn btn-ghost btn-icon btn-sm">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>NSUPDATE Commands</label>
                        <textarea x-model="nsupdateText" rows="12" placeholder="zone example.com.
prereq nxdomain newhost.example.com.
update add newhost.example.com. 3600 A 192.0.2.100
send"></textarea>
                        <p class="form-hint">Enter nsupdate commands. Lines starting with ; or # are comments.</p>
                    </div>
                    <template x-if="nsupdateResult">
                        <div class="card mt-2" :class="nsupdateResult.total_failed > 0 ? 'text-warning' : 'text-success'" style="background: var(--bg-tertiary);">
                            <div class="card-body">
                                <p><strong x-text="nsupdateResult.total_success + ' succeeded, ' + nsupdateResult.total_failed + ' failed'"></strong></p>
                                <template x-for="tx in nsupdateResult.transactions">
                                    <p class="text-muted" x-text="tx.zone + ': ' + tx.message"></p>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="modal-footer">
                    <button @click="showNsupdate = false" class="btn btn-ghost">Close</button>
                    <button @click="executeNsupdate()" class="btn btn-primary" :disabled="saving || !nsupdateText.trim()">
                        <span x-show="saving" class="spinner" style="width: 14px; height: 14px;"></span>
                        Execute
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Atomic Queue Indicator -->
    <template x-if="authenticated && atomicMode && atomicQueue.length > 0">
        <div class="atomic-indicator" @click="showAtomicModal = true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                <rect x="9" y="3" width="6" height="4" rx="1"/>
                <path d="M9 12h6M9 16h6"/>
            </svg>
            <span x-text="atomicQueue.length + ' pending'"></span>
        </div>
    </template>

    <!-- Atomic Actions Modal -->
    <template x-if="showAtomicModal">
        <div class="modal-backdrop" @click.self="showAtomicModal = false">
            <div class="modal" style="max-width: 700px;">
                <div class="modal-header">
                    <h3>Atomic Changes (<span x-text="atomicQueue.length"></span>)</h3>
                    <button @click="showAtomicModal = false" class="btn btn-ghost btn-icon btn-sm">×</button>
                </div>
                <div class="modal-body">
                    <template x-if="atomicQueue.length === 0">
                        <div class="empty-state" style="padding: 2rem;">
                            <p class="text-muted">No pending changes</p>
                        </div>
                    </template>
                    <template x-if="atomicQueue.length > 0">
                        <div class="atomic-queue-list">
                            <template x-for="(op, index) in atomicQueue" :key="index">
                                <div class="atomic-queue-item">
                                    <div class="atomic-queue-action" :class="op.action">
                                        <span x-text="op.action.toUpperCase()"></span>
                                    </div>
                                    <div class="atomic-queue-details">
                                        <div class="atomic-queue-name">
                                            <span class="text-muted" x-text="op.zone.replace(/\.$/, '') + ' / '"></span>
                                            <strong x-text="op.name"></strong>
                                            <span class="record-type" :class="op.type" x-text="op.type"></span>
                                        </div>
                                        <div class="atomic-queue-data text-muted" x-show="op.records">
                                            <span x-text="op.records ? op.records.join(', ') : ''"></span>
                                        </div>
                                    </div>
                                    <button @click="removeAtomicItem(index)" class="btn btn-ghost btn-sm btn-icon" title="Remove">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                            <path d="M18 6L6 18M6 6l12 12"/>
                                        </svg>
                                    </button>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template x-if="atomicResult">
                        <div class="card mt-2" :class="atomicResult.success ? 'text-success' : 'text-danger'" style="background: var(--bg-tertiary);">
                            <div class="card-body">
                                <p><strong x-text="atomicResult.message"></strong></p>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="modal-footer">
                    <button @click="clearAtomicQueue()" class="btn btn-ghost" :disabled="atomicQueue.length === 0">
                        Clear All
                    </button>
                    <button @click="submitAtomicQueue()" class="btn btn-success" :disabled="atomicQueue.length === 0 || saving">
                        <span x-show="saving" class="spinner" style="width: 14px; height: 14px;"></span>
                        Submit All
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Reverse PTR Modal -->
    <template x-if="showReversePtrModal">
        <div class="modal-backdrop" @click.self="showReversePtrModal = false">
            <div class="modal" style="max-width: 1000px;">
                <div class="modal-header">
                    <h3>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" style="vertical-align: middle; margin-right: 0.5rem;">
                            <path d="M9 14l-4 4 4 4"/>
                            <path d="M5 18h14"/>
                            <path d="M15 10l4-4-4-4"/>
                            <path d="M19 6H5"/>
                        </svg>
                        Add Reverse PTR
                    </h3>
                    <button @click="showReversePtrModal = false" class="btn btn-ghost btn-icon btn-sm">×</button>
                </div>
                <div class="modal-body">
                    <template x-if="reversePtrLoading">
                        <div class="loading"><div class="spinner"></div></div>
                    </template>
                    
                    <template x-if="!reversePtrLoading && reversePtrResults.length > 0">
                        <div>
                            <p class="text-muted mb-2">
                                Create PTR records pointing to <strong x-text="reversePtrTarget"></strong>
                            </p>
                            
                            <div class="reverse-ptr-list">
                                <template x-for="(result, index) in reversePtrResults" :key="result.ip">
                                    <div class="reverse-ptr-item" :class="{ 'disabled': !result.zone_managed }">
                                        <div class="reverse-ptr-status">
                                            <template x-if="result.zone_managed && result.existing_ptrs.length === 0">
                                                <span class="status-badge success" title="Will create">✓</span>
                                            </template>
                                            <template x-if="result.zone_managed && result.existing_ptrs.length > 0">
                                                <span class="status-badge warning" title="PTR exists">!</span>
                                            </template>
                                            <template x-if="!result.zone_managed">
                                                <span class="status-badge muted" title="Zone not managed">−</span>
                                            </template>
                                            <template x-if="result.error">
                                                <span class="status-badge error" title="Error">✗</span>
                                            </template>
                                        </div>
                                        <div class="reverse-ptr-details">
                                            <div class="reverse-ptr-ip">
                                                <code x-text="result.ip"></code>
                                                <span class="text-muted">→</span>
                                                <code class="ptr-name" x-text="result.record_name ? result.record_name + '.' + result.reverse_zone : result.ptr_fqdn"></code>
                                            </div>
                                            <div class="reverse-ptr-zone text-muted">
                                                <template x-if="result.zone_managed">
                                                    <span>Zone: <span x-text="result.reverse_zone"></span></span>
                                                </template>
                                                <template x-if="!result.zone_managed && !result.error">
                                                    <span class="text-warning">Reverse zone not managed</span>
                                                </template>
                                                <template x-if="result.error">
                                                    <span class="text-danger" x-text="result.error"></span>
                                                </template>
                                            </div>
                                            <template x-if="result.existing_ptrs.length > 0">
                                                <div class="reverse-ptr-existing">
                                                    <span class="text-warning">Existing: </span>
                                                    <span x-text="result.existing_ptrs.join(', ')"></span>
                                                </div>
                                            </template>
                                        </div>
                                        <template x-if="result.zone_managed">
                                            <label class="reverse-ptr-checkbox">
                                                <input type="checkbox" 
                                                       :checked="reversePtrSelected.includes(result.ip)"
                                                       @change="toggleReversePtrSelection(result.ip)">
                                            </label>
                                        </template>
                                    </div>
                                </template>
                            </div>
                            
                            <template x-if="reversePtrResults.some(r => r.existing_ptrs.length > 0 && r.zone_managed)">
                                <div class="form-group mt-2">
                                    <label>When PTR already exists:</label>
                                    <select x-model="reversePtrMode">
                                        <option value="replace">Replace existing</option>
                                        <option value="add_roundrobin">Add to existing (round-robin)</option>
                                    </select>
                                </div>
                            </template>
                        </div>
                    </template>
                    
                    <template x-if="!reversePtrLoading && reversePtrResults.length === 0">
                        <div class="empty-state" style="padding: 1rem;">
                            <p class="text-muted">No IP addresses to process</p>
                        </div>
                    </template>
                    
                    <template x-if="reversePtrCreateResult">
                        <div class="card mt-2" :class="reversePtrCreateResult.error_count > 0 ? 'text-warning' : 'text-success'" style="background: var(--bg-tertiary);">
                            <div class="card-body">
                                <p><strong x-text="reversePtrCreateResult.created_count + ' created, ' + reversePtrCreateResult.skipped_count + ' skipped' + (reversePtrCreateResult.error_count > 0 ? ', ' + reversePtrCreateResult.error_count + ' errors' : '')"></strong></p>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="modal-footer">
                    <button @click="showReversePtrModal = false" class="btn btn-ghost">Cancel</button>
                    <button @click="createReversePtrs()" 
                            class="btn btn-primary" 
                            :disabled="saving || reversePtrSelected.length === 0">
                        <span x-show="saving" class="spinner" style="width: 14px; height: 14px;"></span>
                        Create <span x-text="reversePtrSelected.length"></span> PTR<span x-show="reversePtrSelected.length !== 1">s</span>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Zone History Modal -->
    <template x-if="showHistoryModal">
        <div class="modal-backdrop" @click.self="closeHistoryModal()">
            <div class="modal" style="max-width: 900px; max-height: 90vh;">
                <div class="modal-header">
                    <h3>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" style="vertical-align: middle; margin-right: 0.5rem;">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        Zone History: <span x-text="selectedZone?.replace(/\.$/, '')"></span>
                    </h3>
                    <button @click="closeHistoryModal()" class="btn btn-ghost btn-icon btn-sm">×</button>
                </div>
                <div class="modal-body" style="overflow-y: auto; max-height: calc(90vh - 180px);">
                    <!-- Serial Input -->
                    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; padding: 0.75rem; background: var(--bg-secondary); border-radius: 0.5rem;">
                        <label for="historyFromSerial" style="white-space: nowrap;"><strong>From Serial:</strong></label>
                        <input 
                            type="number" 
                            id="historyFromSerial"
                            x-model.number="historyFromSerial" 
                            min="0"
                            class="form-control" 
                            style="width: 150px;"
                            :disabled="historyLoading"
                        />
                        <button 
                            class="btn btn-primary" 
                            @click="loadZoneHistory()"
                            :disabled="historyLoading"
                        >
                            <span x-show="!historyLoading">Load History</span>
                            <span x-show="historyLoading">Loading...</span>
                        </button>
                    </div>

                    <!-- Loading State -->
                    <template x-if="historyLoading && !zoneHistory">
                        <div class="loading"><div class="spinner"></div></div>
                    </template>

                    <!-- History Content -->
                    <template x-if="zoneHistory">
                        <div>
                            <!-- Zone Info -->
                            <div class="history-info" style="display: flex; justify-content: space-between; margin-bottom: 1rem; padding: 0.75rem; background: var(--bg-secondary); border-radius: 0.5rem;">
                                <div>
                                    <strong>Current Serial:</strong> <span x-text="formatSerial(zoneHistory.current_serial)"></span>
                                </div>
                                <div>
                                    <strong>History from:</strong> Serial <span x-text="zoneHistory.available_from_serial"></span>
                                </div>
                            </div>

                            <!-- AXFR Warning -->
                            <template x-if="zoneHistory.is_full_axfr">
                                <div class="alert alert-warning" style="margin-bottom: 1rem;">
                                    <strong>Note:</strong> Server responded with full zone transfer. Incremental history not available.
                                </div>
                            </template>

                            <!-- No History -->
                            <template x-if="zoneHistory.history.length === 0">
                                <div class="text-muted" style="text-align: center; padding: 2rem;">
                                    No change history available for this zone.
                                </div>
                            </template>

                            <!-- History Batches -->
                            <template x-if="zoneHistory.history.length > 0">
                                <div class="history-batches">
                                    <template x-for="(batch, index) in zoneHistory.history" :key="batch.from_serial + '-' + batch.to_serial">
                                        <div class="history-batch" style="margin-bottom: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.5rem; overflow: hidden;">
                                            <!-- Batch Header (clickable) -->
                                            <div class="history-batch-header" 
                                                 @click="toggleBatchExpansion(index)"
                                                 style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: var(--bg-secondary); cursor: pointer; user-select: none;"
                                                 :style="rollbackTargetSerial === batch.from_serial ? 'background: var(--accent-subtle)' : ''">
                                                <div style="display: flex; align-items: center; gap: 1rem;">
                                                    <span class="history-expand-icon" x-text="isBatchExpanded(index) ? '▼' : '▶'" style="width: 1rem; font-size: 0.75rem;"></span>
                                                    <div>
                                                        <strong x-text="formatSerial(batch.from_serial)"></strong>
                                                        <span class="text-muted">→</span>
                                                        <strong x-text="formatSerial(batch.to_serial)"></strong>
                                                    </div>
                                                    <span class="badge" x-text="getBatchSummary(index)"></span>
                                                </div>
                                                <button @click.stop="selectRollbackSerial(batch.from_serial)" 
                                                        class="btn btn-warning btn-sm"
                                                        :class="{'btn-ghost': rollbackTargetSerial !== batch.from_serial}"
                                                        title="Rollback to this serial">
                                                    Rollback to <span x-text="batch.from_serial"></span>
                                                </button>
                                            </div>

                                            <!-- Batch Changes (collapsible) -->
                                            <div x-show="isBatchExpanded(index)" x-collapse style="border-top: 1px solid var(--border-color);">
                                                <table class="history-changes-table" style="width: 100%;">
                                                    <thead>
                                                        <tr>
                                                            <th style="width: 60px;">Action</th>
                                                            <th>Name</th>
                                                            <th style="width: 80px;">Type</th>
                                                            <th style="width: 70px;">TTL</th>
                                                            <th>Data</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template x-for="change in batch.changes" :key="change.name + change.type + change.action + change.records.join()">
                                                            <tr :class="change.action === 'add' ? 'history-add' : 'history-delete'">
                                                                <td>
                                                                    <span class="badge" :class="change.action === 'add' ? 'badge-success' : 'badge-danger'">
                                                                        <span x-text="change.action === 'add' ? '+' : '−'"></span>
                                                                    </span>
                                                                </td>
                                                                <td x-text="change.name.replace(/\.$/, '')"></td>
                                                                <td><span class="badge" x-text="change.type"></span></td>
                                                                <td x-text="change.ttl"></td>
                                                                <td style="font-family: monospace; font-size: 0.85rem;">
                                                                    <template x-for="record in change.records" :key="record">
                                                                        <div x-text="record"></div>
