# DNS Zone Manager Configuration
# ===============================
# Copy this file to config.yaml and customize as needed.
#
# Usage:
#   dns-zone-manager --config config.yaml
#
# Priority: YAML config > environment variables > defaults

# =============================================================================
# TSIG Keys (referenced by name from dns and notify sections)
# =============================================================================
# Define all TSIG keys here. Other sections reference them by name.
# This allows you to use different keys for different purposes:
# - Update key: For DDNS updates (add/delete/modify records)
# - AXFR key: For zone transfers (can be the same or different)
# - Notify key: For NOTIFY message authentication
#
# Generate new keys with: tsig-keygen -a hmac-sha256 <key-name>

tsig_keys:
  # Primary update key for DDNS operations
  - name: update-key
    secret: K8vC2mP9nQ4rT6wX1yB3fG5hJ7kL0mN2pR4sU6vW8xY=
    algorithm: hmac-sha256

  # Optional: Separate key for zone transfers (if your DNS server uses different keys)
  # - name: axfr-key
  #   secret: A1bC2dE3fG4hI5jK6lM7nO8pQ9rS0tU1vW2xY3zA4bC=
  #   algorithm: hmac-sha256

  # Optional: Separate key for NOTIFY authentication
  # - name: notify-key
  #   secret: Z9yX8wV7uT6sR5qP4oN3mL2kJ1iH0gF9eD8cB7aA6zY=
  #   algorithm: hmac-sha256

# =============================================================================
# DNS Server Configuration
# =============================================================================
dns:
  # DNS server hostname or IP address (REQUIRED).
  # A hostname (e.g. a Docker Compose service name like "bind") is resolved
  # to an IP at startup, so static network addresses are not required.
  server: bind

  # DNS server port (standard is 53)
  port: 53

  # DNS TCP port for AXFR/DDNS (defaults to port if not set)
  # tcp_port: 53

  # Query timeout in seconds
  timeout: 10.0

  # AXFR zone transfer timeout in seconds
  axfr_timeout: 60.0

  # TSIG key name for DDNS updates (references tsig_keys entry)
  update_tsig_key: update-key

  # TSIG key name for AXFR transfers (defaults to update_tsig_key if not set)
  # axfr_tsig_key: axfr-key

# =============================================================================
# API Key Authentication
# =============================================================================
api_key:
  # Enable API key authentication
  enabled: true

  # Header name for API key (default: X-API-Key)
  header_name: X-API-Key

  # Named API keys - the name is used in audit logs to identify who made changes
  keys:
    - name: alice
      secret: demo-api-key-12345
    - name: bob
      secret: another-key-67890

# =============================================================================
# Azure AD Authentication (optional)
# =============================================================================
azure_ad:
  # Enable Azure AD authentication
  enabled: false

  # Azure AD tenant ID
  tenant_id: ""

  # Azure AD application client ID
  client_id: ""

  # OAuth2 scopes (list)
  scopes:
    - api://dns-zone-manager/.default

# =============================================================================
# Trusted Reverse-Proxy (forward-auth) Authentication (optional)
# =============================================================================
# When enabled, the app trusts an identity header injected by a front proxy
# (e.g. Traefik + oauth2-proxy) and uses it as the authenticated user. The web
# UI also skips its own login screen. ONLY enable this when the backend is
# reachable solely via that proxy, since the proxy must overwrite these headers
# on every request so clients cannot spoof an identity.
proxy_auth:
  enabled: false

  # Request header carrying the authenticated user identity (email).
  user_header: X-Auth-Request-Email

  # Request header carrying the user's display name (optional).
  name_header: X-Auth-Request-Preferred-Username

# =============================================================================
# Zone Cache Configuration
# =============================================================================
cache:
  # Enable zone caching (improves performance)
  enabled: true

  # Minimum zone refresh interval in seconds (floor for SOA refresh)
  min_refresh_interval: 60

  # Maximum zone refresh interval in seconds (ceiling for SOA refresh)
  max_refresh_interval: 86400

  # Maximum cache size in bytes (0 = unlimited, default: 1GB)
  max_size_bytes: 1073741824

# =============================================================================
# NOTIFY Listener Configuration
# =============================================================================
notify:
  # Enable NOTIFY listener for zone change notifications
  enabled: true

  # Address to bind NOTIFY listeners to
  bind_address: 0.0.0.0

  # UDP port for NOTIFY listener
  udp_port: 5354

  # TCP port for NOTIFY listener
  tcp_port: 5354

  # Prefer IXFR over AXFR when refreshing zones
  prefer_ixfr: true

  # Require valid TSIG signature on incoming NOTIFY messages
  require_tsig: false

  # TSIG key name for NOTIFY validation (references tsig_keys entry)
  # If not set, falls back to dns.update_tsig_key when require_tsig is true
  # tsig_key: notify-key

# =============================================================================
# Catalog Zone Configuration (for automatic zone discovery)
# =============================================================================
catalog:
  # Enable catalog zone auto-discovery (RFC 9432)
  enabled: false

  # Catalog zone name
  zone_name: catalog.example.

  # Polling interval for SOA serial checks (seconds)
  poll_interval: 300

  # NOTIFY listener bind address (for catalog zone notifications)
  notify_bind_address: 0.0.0.0

  # NOTIFY listener ports
  notify_udp_port: 5354
  notify_tcp_port: 5354

  # Automatically AXFR zones discovered from catalog
  auto_load_zones: true

  # Remove zones from cache when removed from catalog
  remove_stale_zones: false

# =============================================================================
# Database (storage for scheduled changes and the audit log)
# =============================================================================
# The only persistent state in the system. It holds intent (what to do, when)
# and the audit trail — never zone state. DNS remains the sole source of truth
# for what a zone contains.
#
# The schema is created automatically, so an empty database is all that is
# needed to get started. Migrations run at startup unless auto_migrate is off.
database:
  # sqlite: a local file, no external service needed (default)
  # postgres: an external PostgreSQL server, for durable storage shared by
  #           several application instances
  backend: sqlite

  # Create or upgrade the schema at startup. Required the first time you point
  # at an empty database. Set to false if you would rather apply migrations
  # yourself with 'alembic upgrade head'.
  auto_migrate: true

  # SQLite database file. Defaults to scheduler.database_path when unset.
  path: /var/lib/dns-zone-manager/scheduler.db

  # PostgreSQL connection settings. Required when backend is 'postgres'.
  # postgres:
  #   host: postgres
  #   port: 5432
  #   database: dns_zone_manager
  #   user: dns_zone_manager
  #   password: change-me
  #
  #   # disable, allow, prefer, require, verify-ca, verify-full
  #   sslmode: prefer
  #
  #   # Full connection URI as an alternative to the fields above. When set it
  #   # takes precedence, and sslmode/connect_timeout come from the URI.
  #   # dsn: postgresql://user:password@host:5432/dns_zone_manager?sslmode=require
  #
  #   # Schema placed at the head of search_path
  #   schema: public
  #
  #   # Connection pool size
  #   pool_size: 5
  #
  #   # Connection timeout in seconds
  #   connect_timeout: 10
  #
  #   # Server-side statement timeout in milliseconds (0 disables)
  #   statement_timeout_ms: 30000

# =============================================================================
# Scheduled Changes (intent store)
# =============================================================================
# Stores named, optionally timed DNS changes. Where they are stored is
# configured in the 'database' section above.
scheduler:
  # Enable the scheduled-change store and background runner
  enabled: true

  # Deprecated: use database.path instead. Still honoured as the SQLite
  # location when database.path is not set.
  database_path: /var/lib/dns-zone-manager/scheduler.db

  # Seconds between scheduler poll ticks
  poll_interval: 10

  # Maximum execution attempts before leaving a change as failed
  max_attempts: 3

  # Base retry backoff in seconds (multiplied by attempt number)
  retry_backoff: 60

  # Seconds a claimed change stays locked to a worker
  lease_ttl: 120

  # Default seconds after scheduled_at before a change expires
  default_expiry_window: 3600

# =============================================================================
# Retention (purge completed changes and audit events)
# =============================================================================
# Completed scheduled changes and their cascading audit events can be removed
# by age and/or by total database size. Rows with a future scheduled_at or
# next_attempt_at are never deleted. Draft/scheduled/running are never eligible.
retention:
  # Run retention passes from the scheduler loop
  enabled: true

  # Seconds between retention maintenance passes
  interval: 3600

  # Delete eligible completed changes older than this many days (0 disables)
  max_age_days: 0

  # When the database exceeds this size in MB, trim the oldest eligible rows
  # (0 disables). Default is 2 GiB.
  max_database_mb: 2048

  # Percent of eligible rows to delete per size-trim pass
  trim_percent: 10

  # Cap on size-trim passes per retention tick
  max_trim_passes: 10

  # Statuses eligible for purge
  statuses: [applied, failed, cancelled, expired, reverted]

  # Reclaim disk space after deletes: incremental | full | off
  vacuum: incremental

  # Count and log candidates without deleting
  dry_run: false

# =============================================================================
# Change Webhooks (Slack / Microsoft Teams / generic)
# =============================================================================
# Posts a notification whenever a DNS change is committed, reporting who made
# it, whether it was manual or scheduled, and a link to the change in the
# Scheduled Changes view.
webhooks:
  # Enable outbound notifications
  enabled: false

  # Public base URL of this application, used to build the change link.
  # Required when enabled.
  base_url: https://dns.example.com

  # Per-request HTTP timeout in seconds
  timeout: 5.0

  # Delivery attempts before giving up (transient failures and 5xx only)
  max_retries: 3

  # Base retry backoff in seconds, doubled per attempt
  retry_backoff: 1.0

  # Maximum events held in memory while waiting to be delivered. Events are
  # dropped (and counted in metrics) when full, so DNS writes never block.
  queue_size: 1000

  # Events to notify on, for all targets that do not override it:
  #   change_applied - a change was committed to DNS
  #   change_failed  - a change was rejected or errored
  events:
    - change_applied
    - change_failed

  # Record every manual (non-scheduler) change in the scheduler store as an
  # already-applied change, so every notification has a working link.
  # Requires the scheduler section to be enabled.
  autorecord_manual_changes: true

  targets:
    # Slack incoming webhook: the URL is the credential, so treat it as a secret
    - name: slack-dns
      type: slack
      url: https://hooks.slack.com/services/T000/B000/XXXXXXXX

    # Microsoft Teams: use a Power Automate "When a Teams webhook request is
    # received" workflow URL. Payload is an Adaptive Card.
    - name: teams-dns
      type: teams
      url: https://prod-00.westeurope.logic.azure.com:443/workflows/.../invoke
      # Only notify for these zones (glob patterns, trailing dot optional)
      zones:
        - "*.prod.example.com"
        - internal.example.com

    # Generic JSON endpoint with HMAC request signing
    - name: audit-sink
      type: generic
      url: https://audit.example.com/dns-events
      # Override the global event list for this target
      events:
        - change_failed
      # Extra static headers sent with every request
      headers:
        X-Environment: production
      auth:
        # none | bearer | basic | header | hmac
        type: hmac
        secret: change-me-to-a-long-random-string
        # sha256 or sha512; signature is over "<timestamp>.<body>" and sent as
        # "<algorithm>=<hex>" in the header below
        algorithm: sha256
        header: X-DNS-Signature
        timestamp_header: X-DNS-Timestamp
      # true, false, or a path to a CA bundle for private certificate authorities
      verify_tls: true
      # Per-target timeout override
      timeout: 10.0

    # Other supported auth types:
    #   auth: { type: bearer, secret: my-token }        -> Authorization: Bearer
    #   auth: { type: basic, username: u, password: p } -> Authorization: Basic
    #   auth: { type: header, secret: k, header: X-API-Key }

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  # Log format: 'json' for structured JSON output, 'text' for human-readable
  # Use 'text' for local development, 'json' for production
  format: json

  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: INFO

  # Sample rate for successful GET requests (0.0-1.0)
  # Mutations (POST/PUT/DELETE), errors, and slow requests are always logged
  sample_rate: 0.1

  # Always log requests slower than this (milliseconds)
  slow_threshold_ms: 1000

# =============================================================================
# Frontend Theme / Branding
# =============================================================================
# Controls the web UI name, logo, and colour palettes. Delivered to the SPA
# via GET /ui/config (and GET /ui/logo when using a local logo file).
# Every colour field is optional — omit any token to keep the built-in default.
# Colours must be #rgb / #rrggbb / #rrggbbaa or a CSS named colour.
#
# theme:
#   # Display name in the login screen, sidebar, and document title.
#   # Falls back to the top-level app_name when unset.
#   app_name: Acme DNS
#
#   # Initial mode before any user preference is stored: dark | light | auto
#   default_mode: dark
#
#   # Show a light/dark toggle in the UI (user choice persists in localStorage)
#   allow_mode_toggle: true
#
#   # Logo used as the top-left home button. Supply url OR path, not both.
#   # logo:
#   #   url: https://cdn.example.com/logo.svg
#   #   # path: /etc/dns-zone-manager/logo.svg   # served from GET /ui/logo
#   #   alt: Acme DNS
#
#   # Partial overrides for dark mode (any subset of tokens)
#   dark:
#     accent_primary: "#58a6ff"
#     # bg_primary: "#0f1419"
#     # bg_secondary: "#1a1f2e"
#     # bg_tertiary: "#252b3b"
#     # bg_hover: "#2d3548"
#     # border_color: "#3d4556"
#     # text_primary: "#e6edf3"
#     # text_secondary: "#8b949e"
#     # text_muted: "#6e7681"
#     # accent_success: "#3fb950"
#     # accent_warning: "#d29922"
#     # accent_danger: "#f85149"
#     # accent_info: "#a371f7"
#     # record_mx: "#f778ba"
#     # record_txt: "#79c0ff"
#     # record_ns: "#ffa657"
#
#   # Partial overrides for light mode
#   light:
#     accent_primary: "#0969da"
#     # bg_primary: "#ffffff"
#     # bg_secondary: "#f6f8fa"
#     # bg_tertiary: "#eaeef2"
#     # bg_hover: "#e1e6ec"
#     # border_color: "#d0d7de"
#     # text_primary: "#1f2328"
#     # text_secondary: "#57606a"
#     # text_muted: "#8c959f"
#     # accent_success: "#1a7f37"
#     # accent_warning: "#9a6700"
#     # accent_danger: "#cf222e"
#     # accent_info: "#8250df"

# =============================================================================
# Application Settings
# =============================================================================

# Application name (shown in API docs; also the UI fallback when theme.app_name is unset)
app_name: DNS Zone Manager

# Enable debug mode (enables verbose logging and auto-reload)
debug: false
