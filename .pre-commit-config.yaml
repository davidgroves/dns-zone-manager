repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff format

  - repo: local
    hooks:
      - id: ty
        name: ty type check
        # Call the venv binary directly — `uv run` can recreate .venv mid-hook
        # when the interpreter pin drifts, which then fails with "ty: No such
        # file or directory" / "No module named pre_commit".
        entry: .venv/bin/ty check backend
        language: system
        types: [python]
        pass_filenames: false

      - id: tsc
        name: typescript type check
        entry: npm run typecheck
        language: system
        types: [ts]
        pass_filenames: false

