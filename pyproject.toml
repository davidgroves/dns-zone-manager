[project]
name = "dns-zone-manager"
dynamic = ["version"]
description = "DNS Zone Manager - Web UI and API for DNS record management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []  # Use extras: dns-zone-manager[cli] or dns-zone-manager[api]

[project.optional-dependencies]
cli = [
    "click>=8.1.0",
    "httpx>=0.28.0",
]
api = [
    "dnspython>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "fastapi-azure-auth>=5.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.1.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.21.0",
    "click>=8.1.0",  # For server CLI runner
    "catalog-zone-indexer>=0.2.1",
]
dev = [
    "dns-zone-manager[cli,api]",  # Include both extras for development
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers>=4.9.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "ty>=0.0.1a6",
    "debugpy>=1.8.0",  # VS Code Python debugger
]

[project.scripts]
dns-cli = "dns_zone_manager.cli:main"
dns-zone-manager = "dns_zone_manager.server:serve"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "backend/src/dns_zone_manager/_version.py"

[tool.uv.sources]
catalog-zone-indexer = { index = "codeberg" }

[[tool.uv.index]]
name = "codeberg"
url = "https://codeberg.org/api/packages/davidgroves/pypi/simple/"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["backend/src/dns_zone_manager"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["*/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests requiring Docker (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
