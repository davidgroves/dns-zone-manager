# Alembic configuration for the developer CLI.
#
# The application runs migrations itself at startup (database.auto_migrate), so
# this file only exists for manual work such as generating a new revision:
#
#   DNS_ZONE_MANAGER_CONFIG_FILE=.devcontainer/config.devcontainer.yaml \
#     uv run alembic revision --autogenerate -m "add something"
#   DNS_ZONE_MANAGER_CONFIG_FILE=.devcontainer/config.devcontainer.yaml \
#     uv run alembic upgrade head
#
# The connection URL is not set here: env.py builds it from the application
# config file so there is one source of truth for database settings.

[alembic]
script_location = backend/src/dns_zone_manager/scheduler/migrations
prepend_sys_path = backend/src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
